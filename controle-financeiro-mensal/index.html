<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Controle Financeiro Mensal</title>
</head>

<body>
    <header class="hero-header">
        <div>
            <h1>Salário</h1>
            <input type="text" placeholder="Digite o valor do seu salário">
        </div>

        <div>
            <h1>Planejado</h1>
            <p></p>
        </div>

        <div>
            <h1>Saldo</h1>
            <p></p>
        </div>

    </header>

    <section class="">
        <div class="envelope-and-utton">
            <h2>Seus Envelopes</h2>
            <button type="button"> + Adicionar</button>
        </div>

    </section>

    <section class="hero-itens">
        <article class="container-itens">
            <button type="button"> Mercado </button>
            <button type="button"> Casa </button>
            <button type="button"> Energia </button>
            <button type="button"> Lazer </button>

        </article>
    </section>

    <section class="hero-summary">
        <div class="container-summary">
            <h3>Resumo do mês</h3>

            <p>Total gasto: </p>
            <p>Disponível: </p>

        </div>
    </section>

</body>

</html>
