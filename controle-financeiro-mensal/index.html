<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Controle Financeiro Mensal</title>
</head>

<body>
    <header class="hero-header">
        <div class="salary">
            <h1>Salário</h1>
            <input type="text" id="value" placeholder="Digite o valor do seu salário">
            <button type="button" id="botaoAdd" onclick="valueSalary()"> + Adicionar</button>
        </div>

        <div>
            <h1>Planejado</h1>
            <p> </p>
        </div>

        <div>
            <h1>Saldo</h1>
            <p> </p>
        </div>

        <div>
            <h3>Resumo do mês</h3>
            <p>Total gasto: </p>
            <p>Disponível: </p>
        </div>

    </header>

    <section class="">
        <div class="envelope-and-button">
            <h2>Seus Envelopes</h2>
            <button type="button" id="create"> + Criar</button>
        </div>

    </section>

    <section class="hero-itens">
       
    </section>

    <section class="iten-created">
        <div class="container-iten-created">
            <h3>Mercado</h3>
            <div class="planned-expense">
                <p>Planejado</p>
                <p>R$600</p>

                <p>Gasto</p>
                <p>R$ 0</p>
            </div>
            <div>
                <button type="button" id="addExpense">Adicionar Gasto</button>
            </div>
        </div>
    </section>


    <script src="script.js"></script>
</body>

</html>
